openapi: 3.1.0
info:
  title: cloudattrib API
  version: "1"
  description: |
    The API accepts at most 1 MiB of JSON request data. The configured operator
    authentication mode applies to every route. A loopback-only deployment uses
    the local-operator identity. Bearer and trusted-proxy modes map each request
    to a stable operator ID. Operator IDs scope idempotency and audit records,
    not result visibility.
servers:
  - url: http://127.0.0.1:8080
security:
  - bearerAuth: []
  - trustedProxyIdentity: []
paths:
  /v1/analyze:
    post:
      summary: Analyze one target synchronously.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./analyze-request.schema.json
      responses:
        "200":
          description: A complete, partial, failed, or cancelled terminal report.
          content:
            application/json:
              schema:
                $ref: ./report.schema.json
        "400":
          $ref: "#/components/responses/InvalidSyntax"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/InputTooLarge"
        "422":
          $ref: "#/components/responses/InvalidTarget"
        "503":
          $ref: "#/components/responses/CapabilityUnavailable"
  /v1/lookup/ip:
    post:
      summary: Look up local IP associations without DNS, HTTP, or persistence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IPLookupRequest"
      responses:
        "200":
          description: A complete or partial local lookup result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IPLookupResult"
        "400":
          $ref: "#/components/responses/InvalidSyntax"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/InputTooLarge"
        "422":
          $ref: "#/components/responses/InvalidTarget"
        "503":
          $ref: "#/components/responses/CapabilityUnavailable"
  /v1/jobs:
    post:
      summary: Atomically admit a bounded analysis batch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobSubmission"
      responses:
        "202":
          description: The job was admitted or an idempotent prior admission was returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "429":
          $ref: "#/components/responses/CapacityExceeded"
        "503":
          $ref: "#/components/responses/PersistenceUnavailable"
  /v1/jobs/{id}:
    parameters:
      - $ref: "#/components/parameters/JobID"
    get:
      summary: Return shared-visible job state, target counts, and result links.
      responses:
        "200":
          description: Current job state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "503":
          $ref: "#/components/responses/PersistenceUnavailable"
  /v1/jobs/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/JobID"
    post:
      summary: Request cancellation as the authenticated operator.
      responses:
        "202":
          description: Cancellation was recorded and unscheduled targets were terminalized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
  /v1/results/{id}:
    parameters:
      - $ref: "#/components/parameters/ResultID"
    get:
      summary: Return one immutable stored report.
      responses:
        "200":
          description: Stored report.
          content:
            application/json:
              schema:
                $ref: ./report.schema.json
        "503":
          $ref: "#/components/responses/PersistenceUnavailable"
  /v1/results/{id}/observations:
    parameters:
      - $ref: "#/components/parameters/ResultID"
      - $ref: "#/components/parameters/Limit"
      - $ref: "#/components/parameters/Cursor"
    get:
      summary: Return a deterministic bounded page of supporting observations.
      responses:
        "200":
          description: Observation page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservationPage"
  /v1/results/{id}/reclassify:
    parameters:
      - $ref: "#/components/parameters/ResultID"
    post:
      summary: Enqueue reclassification from retained immutable inputs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReclassificationSubmission"
      responses:
        "202":
          description: The pinned replay job was admitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
  /v1/findings:
    get:
      summary: Search stored findings using deterministic keyset pagination.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: domain
          in: query
          schema: {type: string}
        - name: provider
          in: query
          schema: {type: string}
        - name: product
          in: query
          schema: {type: string}
        - name: relation
          in: query
          schema: {type: string}
        - name: strength
          in: query
          schema: {type: string}
        - name: observed_from
          in: query
          schema: {type: string, format: date-time}
        - name: observed_to
          in: query
          schema: {type: string, format: date-time}
      responses:
        "200":
          description: Finding page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingPage"
  /v1/inventory/import:
    post:
      summary: Import one bounded, retryable chunk of concrete hostnames without probing them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryImport"
      responses:
        "200":
          description: Durable counts, repeated unchanged on an idempotent retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryReceipt"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
  /v1/inventory/validate:
    post:
      summary: Admit DNS or full validation for a frozen inventory selection.
      description: Explicitly schedules target collection through normal job budgets and destination policy. CT expansion is disabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryValidation"
      responses:
        "202":
          description: Durable target job for the selected asset IDs and deletion generations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "429":
          $ref: "#/components/responses/CapacityExceeded"
  /v1/inventory/evidence:
    get:
      summary: Search retained evidence descriptions without collecting targets.
      parameters:
        - name: text
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 256}
        - name: scope
          in: query
          schema: {type: string}
        - name: context
          in: query
          description: Defaults to the configured resolver and destination-policy context. Use unknown for historical reports without context provenance.
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        "200":
          description: Ranked bounded window; truncated does not imply a total relevant-match count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryEvidencePage"
  /v1/inventory/retrieve:
    post:
      summary: Rank retained inventory evidence by lexical, semantic, or hybrid matching.
      description: |
        Query text is carried in the request body. Semantic search requires a local
        model matching the active vector generation. Hybrid results explicitly
        report lexical-only degradation when semantic execution is unavailable.
        Similarity is a ranking value, not attribution confidence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryRetrievalRequest"
      responses:
        "200":
          description: Bounded ranked window with candidate truncation metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryRetrievalPage"
        "422":
          description: Invalid mode, text, filter, or limit.
        "503":
          description: Semantic-only retrieval is unavailable without a matching local model and vector generation.
  /v1/inventory/projection-status:
    get:
      summary: Read pending, running, and failed report-projection counts.
      responses:
        "200":
          description: Durable indexing backlog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryProjectionStatus"
  /v1/inventory:
    get:
      summary: Browse or search known hostnames without making target requests.
      description: |
        Coverage is limited to names known to imported sources and local CT collection.
        Empty results do not prove that a host does not exist. Pages use canonical
        hostname order. Concurrent writes can change later pages.
      parameters:
        - name: mode
          in: query
          schema: {type: string, enum: [browse, exact, descendant, prefix, partial], default: browse}
        - name: query
          in: query
          schema: {type: string}
        - name: scope
          in: query
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - $ref: "#/components/parameters/Cursor"
        - name: include_archived
          in: query
          schema: {type: boolean, default: false}
        - name: format
          in: query
          schema: {type: string, enum: [json, ndjson], default: json}
      responses:
        "200":
          description: A bounded page. NDJSON responses put the next cursor in X-Next-Cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryPage"
            application/x-ndjson:
              schema: {type: string}
  /v1/inventory/{hostname}:
    parameters:
      - name: hostname
        in: path
        required: true
        schema: {type: string}
    get:
      summary: Read one known hostname and its source facts.
      responses:
        "200":
          description: Inventory asset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryAsset"
        "404":
          description: Hostname is not in the inventory.
    delete:
      summary: Remove inventory-owned facts, optionally suppressing rediscovery.
      parameters:
        - name: suppress
          in: query
          schema: {type: boolean, default: false}
      responses:
        "200":
          description: New deletion generation.
          content:
            application/json:
              schema:
                type: object
                required: [deletion_generation]
                properties:
                  deletion_generation: {type: integer, format: int64}
  /v1/inventory/{hostname}/archive:
    parameters:
      - name: hostname
        in: path
        required: true
        schema: {type: string}
    post:
      summary: Hide or restore a known hostname in default search results.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [archived]
              properties:
                archived: {type: boolean}
      responses:
        "200":
          description: Updated inventory asset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryAsset"
  /v1/inventory/{hostname}/evidence:
    parameters:
      - name: hostname
        in: path
        required: true
        schema: {type: string}
    get:
      summary: Read one asset's projected state or pending status in a resolver context.
      parameters:
        - name: context
          in: query
          schema: {type: string}
      responses:
        "200":
          description: Evidence description and state, or pending projection state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryEvidenceResult"
  /v1/providers:
    get:
      summary: Search the canonical provider catalog.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/CatalogQuery"
      responses:
        "200":
          description: Provider page.
  /v1/products:
    get:
      summary: Search the canonical product catalog.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/CatalogQuery"
      responses:
        "200":
          description: Product page.
  /livez:
    get:
      summary: Return process liveness.
      responses:
        "200":
          description: The process accepted the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liveness"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /readyz:
    get:
      summary: Return enabled operation readiness.
      responses:
        "200":
          description: At least one enabled public operation can execute.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: No enabled public operation can execute.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /metrics:
    get:
      summary: Return local Prometheus-compatible operational counters.
      responses:
        "200":
          description: Metrics text.
          content:
            text/plain:
              schema: {type: string}
components:
  parameters:
    JobID:
      name: id
      in: path
      required: true
      schema: {type: string}
    ResultID:
      name: id
      in: path
      required: true
      schema: {type: string}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 500, default: 100}
    Cursor:
      name: cursor
      in: query
      schema: {type: string}
    CatalogQuery:
      name: q
      in: query
      schema: {type: string}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The configured bearer credential maps to a stable operator ID.
    trustedProxyIdentity:
      type: apiKey
      in: header
      name: X-Cloudattrib-Operator
      description: |
        Use only when the server is configured with a trusted proxy range. The
        proxy removes client-supplied values before it sets this verified header.
  responses:
    InvalidSyntax:
      description: The request body is malformed JSON or contains an unknown field.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: The request did not use the configured trusted-operator identity source.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InputTooLarge:
      description: The request body exceeds 1 MiB.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidTarget:
      description: The request is syntactically valid but has invalid target or option values.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CapabilityUnavailable:
      description: No necessary execution capability is available for the requested operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PersistenceUnavailable:
      description: Durable persistence is unavailable or failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    IdempotencyConflict:
      description: The caller reused an idempotency key for a different request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CapacityExceeded:
      description: The global nonterminal target backlog is full.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    InventoryValidation:
      type: object
      additionalProperties: false
      required: [idempotency_key, mode]
      properties:
        idempotency_key: {type: string, minLength: 1}
        bundle_id: {type: string}
        mode: {type: string, enum: [dns, full]}
        asset_ids:
          type: array
          minItems: 1
          maxItems: 1000
          items: {type: string}
        selection:
          type: object
          description: Bounded inventory search request; excludes archived assets and is frozen at admission.
        scope_root: {type: string}
    InventoryProjectionStatus:
      type: object
      required: [pending, running, failed, oldest_pending_age_seconds, protected_reports, protected_document_bytes]
      properties:
        pending: {type: integer, format: int64}
        running: {type: integer, format: int64}
        failed: {type: integer, format: int64}
        oldest_pending_age_seconds: {type: integer, format: int64}
        protected_reports: {type: integer, format: int64}
        protected_document_bytes: {type: integer, format: int64}
    InventoryEvidenceResult:
      type: object
      required: [asset_id, hostname, context_id, description, description_revision, description_hash, description_report_id, evidence_ids, observation_ids, coverage, latest_coverage, omitted, matched_terms, rank, projection_status]
      properties:
        asset_id: {type: string}
        hostname: {type: string}
        context_id: {type: string}
        description: {type: string}
        description_revision: {type: integer, format: int64}
        description_hash: {type: string}
        description_report_id: {type: string}
        evidence_ids: {type: array, items: {type: string}}
        observation_ids: {type: array, items: {type: string}}
        coverage: {type: array, items: {type: string}}
        latest_coverage: {type: array, items: {type: string}}
        latest_http_status: {type: integer}
        latest_http_at: {type: string, format: date-time}
        last_http_response_status: {type: integer}
        last_http_response_at: {type: string, format: date-time}
        last_http_response_report_id: {type: string}
        omitted: {type: integer}
        latest_attempt_at: {type: string, format: date-time}
        latest_attempt_report_id: {type: string}
        last_positive_at: {type: string, format: date-time}
        last_positive_report_id: {type: string}
        matched_terms: {type: array, items: {type: string}}
        rank: {type: number}
        projection_status: {type: string, enum: [ready, pending]}
        dns_questions:
          type: array
          items:
            type: object
            required: [question_name, rrtype, latest_observed_at, latest_outcome, latest_report_id]
            properties:
              question_name: {type: string}
              rrtype: {type: string}
              latest_observed_at: {type: string, format: date-time}
              latest_outcome: {type: string}
              latest_report_id: {type: string}
              last_positive_at: {type: string, format: date-time}
              last_positive_report_id: {type: string}
    InventoryEvidencePage:
      type: object
      required: [items, truncated]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/InventoryEvidenceResult"
        truncated: {type: boolean}
    InventoryRetrievalRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: {type: string, minLength: 1, maxLength: 1024}
        mode: {type: string, enum: [lexical, semantic, hybrid], default: hybrid}
        scope_root: {type: string}
        context_id: {type: string}
        limit: {type: integer, minimum: 1, maximum: 100, default: 50}
    InventoryRetrievalResult:
      allOf:
        - $ref: "#/components/schemas/InventoryEvidenceResult"
        - type: object
          required: [match_modes]
          properties:
            match_modes:
              type: array
              items: {type: string, enum: [exact_hostname, lexical, semantic]}
            semantic_similarity:
              type: number
              description: Cosine similarity, not evidence confidence.
            model_generation: {type: string}
            fusion_score: {type: number}
    InventoryRetrievalPage:
      type: object
      required: [items, truncated, candidate_truncated, degraded_to_lexical]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/InventoryRetrievalResult"
        truncated: {type: boolean}
        candidate_truncated: {type: boolean}
        degraded_to_lexical: {type: boolean}
        model_generation: {type: string}
    InventoryImport:
      type: object
      additionalProperties: false
      required: [operation_id, chunk_id, source_id, scope_roots, entries]
      properties:
        operation_id: {type: string, minLength: 1, maxLength: 128}
        chunk_id: {type: string, minLength: 1, maxLength: 128}
        source_id: {type: string, minLength: 1, maxLength: 128}
        scope_roots:
          type: array
          minItems: 1
          maxItems: 32
          items: {type: string}
        entries:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required: [hostname]
            properties:
              hostname: {type: string}
              observed_at: {type: string, format: date-time}
    InventoryReceipt:
      type: object
      required: [operation_id, chunk_id, counts]
      properties:
        operation_id: {type: string}
        chunk_id: {type: string}
        counts:
          type: object
          required: [accepted, duplicate, invalid, wildcard, out_of_scope]
          properties:
            accepted: {type: integer}
            duplicate: {type: integer}
            invalid: {type: integer}
            wildcard: {type: integer}
            out_of_scope: {type: integer}
            suppressed: {type: integer}
            stale: {type: integer}
    InventorySource:
      type: object
      required: [kind, id, provenance, verification, first_received_at, last_received_at]
      properties:
        kind: {type: string, enum: [hostname_import, ct, report]}
        id: {type: string}
        provenance: {type: string}
        verification: {type: string}
        first_observed_at: {type: string, format: date-time}
        last_observed_at: {type: string, format: date-time}
        first_received_at: {type: string, format: date-time}
        last_received_at: {type: string, format: date-time}
        reference: {type: string}
        log_id: {type: string}
        entry_index: {type: string}
        checkpoint_id: {type: string}
    InventoryAsset:
      type: object
      required: [id, hostname, normalization_version, deletion_generation, scopes, sources]
      properties:
        id: {type: string}
        hostname: {type: string}
        normalization_version: {type: string}
        archived_at: {type: string, format: date-time}
        deletion_generation: {type: integer, format: int64}
        scopes: {type: array, items: {type: string}}
        sources:
          type: array
          items:
            $ref: "#/components/schemas/InventorySource"
    InventoryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/InventoryAsset"
        next_cursor: {type: string}
    JobSubmission:
      type: object
      additionalProperties: false
      required: [idempotency_key, targets]
      properties:
        idempotency_key: {type: string}
        bundle_id: {type: string}
        targets:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: ./analyze-request.schema.json
    ReclassificationSubmission:
      type: object
      additionalProperties: false
      required: [idempotency_key, bundle_id]
      properties:
        idempotency_key: {type: string}
        bundle_id: {type: string}
    Job:
      type: object
      required: [id, status, cancel_requested, created_at, updated_at, counts, targets]
      properties:
        id: {type: string}
        status: {type: string, enum: [queued, running, completed, partial, failed, cancelled]}
        bundle_id: {type: string}
        cancel_requested: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        counts: {type: object, additionalProperties: {type: integer}}
        targets:
          type: array
          items:
            type: object
            required: [id, input_index, status, attempts]
            properties:
              id: {type: string}
              input_index: {type: integer}
              status: {type: string}
              attempts: {type: integer}
              terminal_reason: {type: string}
              result_url: {type: string}
    ObservationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: ./observation.schema.json
        next_cursor: {type: string}
    FindingPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [report_id, classified_at, finding]
            properties:
              report_id: {type: string}
              classified_at: {type: string, format: date-time}
              finding:
                $ref: ./finding.schema.json
        next_cursor: {type: string}
    IPLookupRequest:
      type: object
      additionalProperties: false
      required: [address]
      properties:
        address:
          type: string
          format: ip
        match:
          type: string
          enum: [all, longest]
          default: all
        include_retired:
          type: boolean
          default: false
        categories:
          type: array
          items:
            type: string
    IPLookupResult:
      type: object
      required: [address, status, associations, asn, coverage]
      properties:
        address:
          type: string
          format: ip
        status:
          type: string
          enum: [complete, partial]
        associations:
          type: array
          items:
            type: object
        asn:
          type: array
          items:
            type: object
        coverage:
          type: array
          items:
            type: object
    Liveness:
      type: object
      required: [status]
      properties:
        status:
          const: live
    Readiness:
      type: object
      required: [state, operations]
      properties:
        state:
          type: string
          enum: [ready, degraded, unavailable]
        operations:
          type: array
          items:
            type: object
            required: [name, state]
            properties:
              name:
                type: string
              state:
                type: string
                enum: [ready, degraded, unavailable]
              capabilities:
                type: array
                items:
                  type: object
              reason:
                type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
