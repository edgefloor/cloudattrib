name: cloudattrib

services:
  volume-init:
    image: alpine:3.22.1@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
    command: ["chown", "65532:65532", "/var/lib/cloudattrib/bundles"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN"]
    volumes:
      - bundles:/var/lib/cloudattrib/bundles
    restart: "no"

  postgres:
    image: postgres:18.0-alpine3.22@sha256:48c8ad3a7284b82be4482a52076d47d879fd6fb084a1cbfccbd551f9331b0e40
    environment:
      POSTGRES_DB: cloudattrib
      POSTGRES_USER: cloudattrib
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudattrib -d cloudattrib"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  unbound:
    image: mvance/unbound:1.22.0@sha256:76906da36d1806f3387338f15dcf8b357c51ce6897fb6450d6ce010460927e90
    platform: linux/amd64
    volumes:
      - ./deploy/unbound.conf:/opt/unbound/etc/unbound/unbound.conf:ro
    networks:
      - collector
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["serve", "--config", "/etc/cloudattrib/config.yaml"]
    environment:
      CLOUDATTRIB_CONFIG: /etc/cloudattrib/config.yaml
    depends_on:
      volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      unbound:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"
    secrets:
      - source: api_credentials
        target: api-credentials
        uid: "65532"
        gid: "65532"
        mode: 0400
      - source: postgres_dsn
        target: postgres-dsn
        uid: "65532"
        gid: "65532"
        mode: 0400
    volumes:
      - ./deploy/config.compose.yaml:/etc/cloudattrib/config.yaml:ro
      - bundles:/var/lib/cloudattrib/bundles
      - ${CLOUDATTRIB_SOURCE_DIR:-./data/sources}:/var/lib/cloudattrib/sources:ro
    networks:
      - backend
      - collector
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    restart: unless-stopped

  updater:
    profiles: ["update"]
    build:
      context: .
      dockerfile: Dockerfile
    command: ["datasets", "sync", "--config", "/etc/cloudattrib/config.yaml"]
    environment:
      CLOUDATTRIB_CONFIG: /etc/cloudattrib/config.yaml
    depends_on:
      volume-init:
        condition: service_completed_successfully
    secrets:
      - source: postgres_dsn
        target: postgres-dsn
        uid: "65532"
        gid: "65532"
        mode: 0400
    volumes:
      - ./deploy/config.compose.yaml:/etc/cloudattrib/config.yaml:ro
      - bundles:/var/lib/cloudattrib/bundles
      - ${CLOUDATTRIB_SOURCE_DIR:-./data/sources}:/var/lib/cloudattrib/sources:ro
    networks:
      - update
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    restart: "no"

networks:
  backend:
    internal: true
  collector: {}
  update: {}

volumes:
  bundles: {}
  postgres: {}

secrets:
  api_credentials:
    file: ${CLOUDATTRIB_API_CREDENTIALS_FILE:-./secrets/api-credentials}
  postgres_password:
    file: ${CLOUDATTRIB_POSTGRES_PASSWORD_FILE:-./secrets/postgres-password}
  postgres_dsn:
    file: ${CLOUDATTRIB_POSTGRES_DSN_FILE:-./secrets/postgres-dsn}
