server:
  interface: 0.0.0.0
  port: 53
  access-control: 0.0.0.0/0 allow
  do-ip4: yes
  do-ip6: yes
  do-udp: yes
  do-tcp: yes
  hide-identity: yes
  hide-version: yes
  harden-below-nxdomain: yes
  harden-dnssec-stripped: yes
  qname-minimisation: yes
  prefetch: yes
  num-threads: 2
  msg-cache-size: 32m
  rrset-cache-size: 64m
  verbosity: 1

remote-control:
  control-enable: no
